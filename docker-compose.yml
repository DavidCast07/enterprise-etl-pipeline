services:
  minio:
    image: alpine:latest
    container_name: minio_datalake
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin_etl
      MINIO_ROOT_PASSWORD: supersecret_s3_password
    command: >
      sh -c "apk add --no-cache curl &&
             curl -O https://dl.min.io/server/minio/release/linux-amd64/minio &&
             chmod +x minio &&
             mkdir -p /data/raw-data &&
             ./minio server /data --console-address ':9001'"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
